<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CineFlix</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ================= PROFILE SCREEN ================= -->

<section id="profiles">

<div class="logo">

Cine<span>Flix</span>

</div>

<h1>

Who's Watching?

</h1>

<div class="profiles">

<div class="profile">

<img src="images/avatar1.jpg">

<p>Alex</p>

</div>

<div class="profile">

<img src="images/avatar2.jpg">

<p>Emma</p>

</div>

<div class="profile">

<img src="images/avatar3.jpg">

<p>John</p>

</div>

<div class="profile">

<img src="images/avatar4.jpg">

<p>Guest</p>

</div>

</div>

<button id="manage">

Manage Profiles

</button>

</section>

<!-- HOME -->

<section id="home">

<header>

<div class="logo">

Cine<span>Flix</span>

</div>

<nav>

<a href="#">Home</a>

<a href="#">TV Shows</a>

<a href="#">Movies</a>

<a href="#">My List</a>

</nav>

<div class="search">

<input

type="text"

placeholder="Search Movies..."

id="searchMovie">

<i class="fa-solid fa-magnifying-glass"></i>

</div>

</header>

<section class="hero">

<div class="overlay">

<h1>

Interstellar

</h1>

<p>

A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.

</p>

<div class="buttons">

<button class="play">

▶ Play

</button>

<button class="info">

More Info

</button>

</div>

</div>

</section>
<section class="movie-row">

<h2>

Trending Now

</h2>

<div id="trending" class="movies">

</div>

</section>

<section class="movie-row">

<h2>

Top Rated

</h2>

<div id="topRated" class="movies">

</div>

</section>

<section class="movie-row">

<h2>

Action Movies

</h2>

<div id="action" class="movies">

</div>

</section>

<section class="movie-row">

<h2>

Comedy

</h2>

<div id="comedy" class="movies">

</div>

</section>

<footer>

<p>

©2026 CineFlix

</p>

</footer>

</section>

<script src="movies.js"></script>

<script src="script.js"></script>

</body>

</html>
